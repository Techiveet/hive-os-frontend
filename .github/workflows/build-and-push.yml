name: Build and Publish Scanned Images

on:
  push:
    branches: [main, codex/annual-pricing-loading-state]
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  build:
    outputs:
      candidate_digest: ${{ steps.candidate-image.outputs.digest }}
    needs: security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify SSR request-cache lifetime
        run: |
          npm ci
          npx tsx --test tests/query-client-ssr.test.ts
          npx tsx tests/attendance/hikvision-registration.test.ts
      - name: Select immutable candidate or production image tags
        id: image-tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/techiveet/hive-os-frontend:${GITHUB_SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: candidate-image
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Techiveet/hive-os-frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CENTRAL_DOMAINS=${{ vars.NEXT_PUBLIC_CENTRAL_DOMAINS }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'techiveet.com' }}
            NEXT_PUBLIC_SERVER_IP=${{ vars.NEXT_PUBLIC_SERVER_IP }}
            NEXT_PUBLIC_FRONTEND_DOMAIN=${{ vars.NEXT_PUBLIC_FRONTEND_DOMAIN || 'hive.techiveet.com' }}
            NEXT_PUBLIC_BACKEND_DOMAIN=${{ vars.NEXT_PUBLIC_BACKEND_DOMAIN || 'hive-backend.techiveet.com' }}
            NEXT_PUBLIC_REVERB_DOMAIN=${{ vars.NEXT_PUBLIC_REVERB_DOMAIN || 'hive-ws.techiveet.com' }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ secrets.NEXT_PUBLIC_REVERB_APP_KEY }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST || 'hive-ws.techiveet.com' }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT || '443' }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME || 'https' }}
            INTERNAL_API_URL=${{ vars.INTERNAL_API_URL || 'http://backend:8000/api/v1' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_SKIP_BUILD_TYPECHECK=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block deployment of vulnerable candidate image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_DIGEST: ${{ steps.candidate-image.outputs.digest }}
        run: |
          test -n "$CANDIDATE_DIGEST"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.1 image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "ghcr.io/techiveet/hive-os-frontend@$CANDIDATE_DIGEST"
      - name: Promote scanned image on main
        if: github.ref == 'refs/heads/main'
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate-image.outputs.digest }}
        run: |
          test -n "$CANDIDATE_DIGEST"
          docker buildx imagetools create --tag ghcr.io/techiveet/hive-os-frontend:latest \
            "ghcr.io/techiveet/hive-os-frontend@$CANDIDATE_DIGEST"
