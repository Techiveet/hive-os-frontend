name: Live annual pricing verification
on:
  push:
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-annual-pricing-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-pricing-live-evidence
          path: annual-pricing-evidence/
          if-no-files-found: ignore
