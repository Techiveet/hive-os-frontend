name: Security
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan accessible Git history for secrets
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --pull=never --rm --network none -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact=100 --no-banner --log-level error --log-opts="--all --no-textconv --no-ext-diff" 2> "$RUNNER_TEMP/gitleaks.stderr"
          test ! -s "$RUNNER_TEMP/gitleaks.stderr"
  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Block high and critical locked dependency advisories
        run: npm audit --audit-level=high
  content-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:security:rich-text
      - run: npm run test:security:route-access
      - run: npm run test:security:mfa-cache

  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test SQL and code-execution detector behavior
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.183.0 \
            sh -c 'mkdir /tmp/hive-rules && cp .semgrep.yml /tmp/hive-rules/rules.yml && \
              cp security/semgrep/request-sql.php /tmp/hive-rules/rules.php && \
              cp security/semgrep/request-eval.js /tmp/hive-rules/rules.js && \
              semgrep --test --metrics=off /tmp/hive-rules'
      - name: Analyze untrusted data reaching SQL or code execution
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.183.0 \
            semgrep scan --metrics=off --disable-version-check --config .semgrep.yml --error --strict --timeout 60 --severity ERROR \
            --exclude security/semgrep --exclude vendor --exclude node_modules --exclude workspace --exclude tmp --exclude storage --exclude .next .
